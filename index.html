<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- SVG first so capable browsers get the scalable version; the .ico is the
         fallback and also answers the bare /favicon.ico request browsers make
         on their own. -->
    <link rel="icon" type="image/svg+xml" href="/my-portfolio/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/my-portfolio/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/my-portfolio/apple-touch-icon.png" />

    <title>Shahzeb Umer — Software Engineer</title>
    <meta
      name="description"
      content="Software engineer. Browser internals, multimodal AI, and production platforms at scale. Simplicity is prerequisite for reliability."
    />
    <meta name="author" content="Shahzeb Umer" />
    <!-- Paper by default, the old slate where the OS asks for dark. -->
    <meta name="theme-color" content="#fbfaf6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
        <meta property="og:type" content="website" />
    <meta property="og:title" content="Shahzeb Umer — Software Engineer" />
    <meta
      property="og:description"
      content="Browser internals, multimodal AI, and production platforms at scale."
    />
    <meta property="og:url" content="https://umershahzeb02.github.io/my-portfolio/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Computer Modern is bundled from node_modules and declared in
         index.css, so there is nothing to fetch from a font CDN. The Inter
         and JetBrains Mono links that used to sit here were two DNS lookups
         and a render-blocking stylesheet for faces the page no longer uses. -->

    <!-- Runs before first paint, so the page never flashes the wrong theme.
         A stored choice wins; failing that, follow the operating system.
         Anything unexpected falls through to the light paper. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
