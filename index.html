<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- SVG first so capable browsers get the scalable version; the .ico is the
         fallback and also answers the bare /favicon.ico request browsers make
         on their own. -->
    <link rel="icon" type="image/svg+xml" href="/my-portfolio/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/my-portfolio/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/my-portfolio/apple-touch-icon.png" />

    <!-- Title, description, canonical and Open Graph tags are per page, filled
         in by src/entry-server.jsx. -->
    <!--app-head-->
    <meta name="author" content="Shahzeb Umer" />
    <!-- Browser and phone status-bar tint: the page's own ground, so the bar
         runs into the page with no seam. Keep in step with --paper and
         --ground in index.css; these were left on the old slate palette when
         the theme moved. -->
    <meta name="theme-color" content="#faf8f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1f21" media="(prefers-color-scheme: dark)" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Night mode's faces. Computer Modern is bundled from node_modules and
         declared in index.css instead; a browser only downloads a face the
         page actually references, so each theme pulls its own and neither
         pays for the other. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Runs before first paint, so the page never flashes the wrong theme.
         A stored choice wins; failing that, follow the operating system.
         Anything unexpected falls through to the light paper. -->
    <script>
      /* Swaps the SVG favicon to match the theme. The <link> element is
         replaced rather than having its href reassigned: browsers cache
         favicons hard, and mutating href in place is frequently ignored.

         Only the SVG icon is swapped. The .ico fallback below it stays put —
         it exists for browsers that cannot render an SVG favicon at all, and
         those are not the browsers that will follow a theme change. */
      /* A page reached through a view transition is snapshotted as soon as
         it can render, and anything still waiting to fade in would be caught
         invisible: the post title would morph into nothing. The transition is
         the entrance on those navigations, so the fade-ins stand down. */
      window.addEventListener("pagereveal", function (e) {
        if (e.viewTransition) document.documentElement.classList.add("vt-arrived");
      });

      window.__setFavicon = function (dark) {
        try {
          var href = dark
            ? "/my-portfolio/favicon.svg"
            : "/my-portfolio/favicon-light.svg";
          var old = document.querySelector(
            'link[rel="icon"][type="image/svg+xml"]'
          );
          if (old && old.getAttribute("href") === href) return;
          var link = document.createElement("link");
          link.rel = "icon";
          link.type = "image/svg+xml";
          link.href = href;
          if (old) old.remove();
          document.head.appendChild(link);
        } catch (e) {
          /* leave whatever the markup declared */
        }
      };

      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          window.__setFavicon(dark);
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <!-- Every page now arrives with its content already in the HTML. Without
         this, a visitor with JavaScript off would get it all at opacity 0,
         waiting on a reveal that never runs. -->
    <noscript><style>.reveal { opacity: 1; transform: none; } .code-copy { display: none; }</style></noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <!--app-data-->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
